# ==============================================================================
# SisPiro ERP — Orquestração de Produção (Docker Compose)
# ==============================================================================
# Uso:
#   1. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   2. Para rodar com o Nginx Gateway:
#      docker compose -f docker-compose.prod.yml --env-file .env.production --profile gateway up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sispiro_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_pirotecnico}
      POSTGRES_USER: ${POSTGRES_USER:-sispiro_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sispiro_app} -d ${POSTGRES_DB:-erp_pirotecnico}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sispiro_net

  # ----------------------------------------------------------------------------
  # 2. Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sispiro_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sispiro_net

  # ----------------------------------------------------------------------------
  # 3. Backend NestJS
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sispiro_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sispiro_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erp_pirotecnico}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Defina AUTH_JWT_SECRET no .env.production}
      AUTH_JWT_EXPIRES_IN: ${AUTH_JWT_EXPIRES_IN:-15m}
      AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET:?Defina AUTH_REFRESH_SECRET no .env.production}
      AUTH_REFRESH_EXPIRES_IN: ${AUTH_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,http://localhost}
      FOCUS_NFE_ENV: ${FOCUS_NFE_ENV:-sandbox}
      FOCUS_NFE_TOKEN: ${FOCUS_NFE_TOKEN:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - sispiro_net

  # ----------------------------------------------------------------------------
  # 4. Frontend Next.js Standalone
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_API_PREFIX: ${NEXT_PUBLIC_API_PREFIX:-/api/v1}
    container_name: sispiro_frontend_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - sispiro_net

  # ----------------------------------------------------------------------------
  # 5. Reverse Proxy Nginx (Opcional - ativado com: --profile gateway)
  # ----------------------------------------------------------------------------
  # Publica apenas em loopback (127.0.0.1): este gateway não termina TLS.
  # Ele existe para unificar frontend+backend sob uma porta interna única,
  # que o proxy/reverse-proxy já existente no host (Nginx/Traefik/Caddy,
  # responsável pelo certificado) deve repassar via proxy_pass. Ver
  # docs/RUNBOOK-IMPLANTACAO-PRODUCAO.md seção 4.1.
  gateway:
    image: nginx:1.27-alpine
    container_name: sispiro_gateway_prod
    restart: unless-stopped
    profiles: ["gateway"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sispiro_net

networks:
  sispiro_net:
    driver: bridge

volumes:
  postgres_data:
    name: sispiro_postgres_data_prod
  redis_data:
    name: sispiro_redis_data_prod
